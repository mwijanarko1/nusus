name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # CLI bin imports dist/; tests also self-build when dist is missing.
      - run: bun run build
      - run: bun test
      - run: bun run typecheck
